; ESP32 trasero del kart (control de motores traseros, CAN 0x100/0x123).
; Entorno reproducible: plataforma, core y bibliotecas con versión fija.
;
; El firmware hallado en la placa (respaldo 2026-10-07) se compiló con Arduino IDE y
; core esp32 3.3.10 / ESP-IDF 5.5.4. pioarduino no publicó versión para 3.3.10; se usa
; 55.03.311 = core 3.3.11, la más próxima (misma API LEDC por pin de 3.x).
;
; Uso:  pio run -e usb                 compilar
;       pio run -e usb -t upload       grabar por USB (coordinar el banco antes)
;       pio device monitor -e usb      monitor serie USB
;       pio device monitor -e wifi     monitor TCP (portátil conectado a la red del kart)

[platformio]
default_envs = usb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
; Igual que la imagen grabada: cabecera del bootloader = DIO, 80 MHz, 4 MB.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default.csv
lib_deps =
    coryjfowler/mcp_can@1.5.1
    electroniccats/MPU6050@1.4.5
monitor_speed = 115200
monitor_filters = time

[env:usb]
upload_port = COM4
monitor_port = COM4
upload_speed = 460800

[env:wifi]
; Solo monitorización: el ESP32 crea la red y escucha en 192.168.4.1:3333.
monitor_port = socket://192.168.4.1:3333
