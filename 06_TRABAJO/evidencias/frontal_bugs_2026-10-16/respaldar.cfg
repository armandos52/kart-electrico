# Frontal F746 15-10-2026. Lectura en ejecucion: no halt, reset, erase, program ni unlock.
# QSPI ya en modo mapeado por la aplicacion instalada (CCR FMODE=3): se lee 0x90000000 sin reconfigurar.
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
set chipid [lindex [read_memory 0xE0042000 32 1] 0]
if {($chipid & 0xFFF) != 0x449} {error "Dispositivo distinto de STM32F74x/75x: se cancela lectura"}
foreach v [read_memory 0x1FF0F420 32 3] e {0x00420026 0x54435003 0x20353036} { if {$v != $e} {error "UID distinto: se cancela"} }
set ccr [lindex [read_memory 0xA0001014 32 1] 0]
if {(($ccr >> 26) & 3) != 3} {error "QSPI no esta en modo mapeado: se cancela para no reconfigurar"}
set R {C:/kart proyecto/07_DESARROLLO/respaldos/stm32_f746/2026-10-16}
echo "INICIO=[clock format [clock seconds] -format %H:%M:%S]"
dump_image "$R/flash_interna_lectura1.bin" 0x08000000 0x100000
dump_image "$R/flash_interna_lectura2.bin" 0x08000000 0x100000
dump_image "$R/otp_lectura.bin" 0x1FF0F000 0x420
dump_image "$R/option_bytes_lectura.bin" 0x1FFF0000 0x20
echo "INTERNA_FIN=[clock format [clock seconds] -format %H:%M:%S]"
dump_image "$R/qspi_lectura1.bin" 0x90000000 0x1000000
echo "QSPI1_FIN=[clock format [clock seconds] -format %H:%M:%S]"
dump_image "$R/qspi_lectura2.bin" 0x90000000 0x1000000
echo "QSPI2_FIN=[clock format [clock seconds] -format %H:%M:%S]"
echo "QUADSPI_CCR_DESPUES=[format 0x%08X [lindex [read_memory 0xA0001014 32 1] 0]]"
shutdown

