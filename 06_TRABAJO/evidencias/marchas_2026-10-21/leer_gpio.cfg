# Solo lectura, sin halt/reset/escrituras. GPIOC selector, GPIOG freno.
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
if {([lindex [read_memory 0xE0042000 32 1] 0] & 0xFFF) != 0x449} {error "No es STM32F74x"}
echo "GPIOC_MODER=[read_memory 0x40020800 32 1]"
echo "GPIOC_PUPDR=[read_memory 0x4002080c 32 1]"
echo "GPIOC_IDR=[read_memory 0x40020810 32 1]"
echo "GPIOG_MODER=[read_memory 0x40021800 32 1]"
echo "GPIOG_PUPDR=[read_memory 0x4002180c 32 1]"
echo "GPIOG_IDR=[read_memory 0x40021810 32 1]"
echo "UID=[read_memory 0x1FF0F420 32 3]"
shutdown
