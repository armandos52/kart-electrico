# ENS-0026: interna + QSPI; UID/RDP comprobados.
source [find board/stm32f746g-disco.cfg]
adapter serial 0670FF3332584B3043206038
gdb port disabled
tcl port disabled
telnet port disabled
init
set chipid [lindex [read_memory 0xE0042000 32 1] 0]
if {($chipid & 0xFFF) != 0x449} {error "Dispositivo distinto de STM32F74x/75x: se cancela"}
foreach v [read_memory 0x1FF0F420 32 3] e {0x00420026 0x54435003 0x20353036} {
	if {$v != $e} {error "UID distinto del respaldado: se cancela"}
}
set optcr [lindex [read_memory 0x40023C14 32 1] 0]
if {(($optcr >> 8) & 0xFF) != 0xAA} {error "RDP distinto de nivel 0: se cancela"}
echo "INICIO=[clock format [clock seconds] -format %H:%M:%S]"
# Snapshot dev8 identificado en respaldo; exigir OFF, N y pedal no pisado.
foreach address {0x20000892 0x20000893 0x200008bc 0x200008bd} {
    if {[lindex [read_memory $address 8 1] 0] != 0} {error "START/marcha/selector no OFF-N: cancelar"}
}
if {[lindex [read_memory 0x20000878 16 1] 0] > 320} {error "Pedal no en zona cero: cancelar"}
program {C:/kart proyecto/06_TRABAJO/evidencias/marchas_2026-10-21/binarios/stm32_frontal-v1.3-dev9-ui.hex} verify
echo "FIN_PROGRAMA=[clock format [clock seconds] -format %H:%M:%S]"
flash banks
reset run
echo "RESET_RUN=[clock format [clock seconds] -format %H:%M:%S]"
shutdown
