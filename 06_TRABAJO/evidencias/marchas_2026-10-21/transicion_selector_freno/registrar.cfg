# ENS-0020: registro del pedal por SWD. Solo lectura, sin halt/reset/escritura.
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
if {([lindex [read_memory 0xE0042000 32 1] 0] & 0xFFF) != 0x449} {error "No es STM32F74x"}
echo "VEC [read_memory 0x8000000 8 456]"
echo "VER [read_memory 0x80389a1 8 26]"
set siguiente [clock milliseconds]; set fin [expr {$siguiente + 40000}]
while {[clock milliseconds] < $fin && ![file exists {C:/kart proyecto/06_TRABAJO/evidencias/marchas_2026-10-21/transicion_selector_freno/PARAR}]} {
	set ms [clock milliseconds]; set m [read_memory 0x20000854 32 29]
	echo "M $ms $m"
	set siguiente [expr {$siguiente + 50}]; set espera [expr {$siguiente - [clock milliseconds]}]
	if {$espera > 0} {sleep $espera} else {set siguiente [clock milliseconds]}
}
echo "FIN"
shutdown
