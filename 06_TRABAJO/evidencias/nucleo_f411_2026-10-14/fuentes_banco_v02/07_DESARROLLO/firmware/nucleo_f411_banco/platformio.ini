; Banco aislado NUCLEO-F411RE + MCUFRIEND UNO. No firmware del kart.
[env:nucleo_f411re]
platform = ststm32@20.0.0
board = nucleo_f411re
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
lib_deps =
    prenticedavid/MCUFRIEND_kbv@3.1.0-Beta
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -DBENCH_DIAGNOSTIC_ONLY=0
build_src_flags =
    -I../stm32_frontal/tests/stubs
    -I../stm32_frontal/Core/Inc
    -I../esp32_trasero/lib/kart_control
