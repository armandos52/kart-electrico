# ENS-0015. Lectura en ejecución: no halt, reset, erase, program ni unlock.
source [find board/st_nucleo_f4.cfg]
adapter serial 0672FF564881774867244057
adapter speed 950
gdb port disabled
tcl port disabled
telnet port disabled
stm32f4x.cpu configure -event examine-end {}
init
set chipid [lindex [read_memory 0xE0042000 32 1] 0]
echo [format "DBGMCU_IDCODE=0x%08X" $chipid]
if {($chipid & 0xFFF) != 0x431} {error "Dispositivo distinto de STM32F411: se cancela lectura"}
echo "ESTADO_ANTES=[stm32f4x.cpu curstate]"
echo "FLASH_OPTCR=[read_memory 0x40023C14 32 1]"
echo "FLASH_SIZE_KiB=[read_memory 0x1FFF7A22 16 1]"
flash probe 0
echo [flash info 0]
dump_image {C:/kart proyecto/07_DESARROLLO/respaldos/nucleo_f411/2026-10-14/flash_lectura1.bin} 0x08000000 0x80000
dump_image {C:/kart proyecto/07_DESARROLLO/respaldos/nucleo_f411/2026-10-14/flash_lectura2.bin} 0x08000000 0x80000
dump_image {C:/kart proyecto/07_DESARROLLO/respaldos/nucleo_f411/2026-10-14/option_bytes_lectura.bin} 0x1FFFC000 16
echo "ESTADO_DESPUES=[stm32f4x.cpu curstate]"
shutdown
