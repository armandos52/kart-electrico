# ENS-0015: identificar sin reset, halt, escritura de flash ni cambio de protecciones.
source [find board/st_nucleo_f4.cfg]
adapter serial 0672FF564881774867244057
adapter speed 1000
gdb_port disabled
tcl_port disabled
telnet_port disabled
# Evitar los ajustes automáticos de DBGMCU del fichero de familia.
stm32f4x.cpu configure -event examine-end {}
init
targets
echo "DBGMCU_IDCODE:"
mdw 0xE0042000 1
echo "FLASH_OPTCR (solo lectura):"
mdw 0x40023C14 1
flash probe 0
flash info 0
shutdown
