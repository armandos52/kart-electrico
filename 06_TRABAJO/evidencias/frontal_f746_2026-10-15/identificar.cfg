# Frontal F746 15-10-2026: identificar sin reset, halt, escritura de flash ni cambio de protecciones.
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1000
gdb port disabled
tcl port disabled
telnet port disabled
# Evitar los ajustes automaticos de DBGMCU del fichero de familia.
stm32f7x.cpu configure -event examine-end {}
init
proc hx {addr width n} { set r {}; foreach v [read_memory $addr $width $n] { lappend r [format "0x%0*X" [expr {$width/4}] $v] }; return $r }
echo "ESTADO_ANTES=[stm32f7x.cpu curstate]"
echo "DBGMCU_IDCODE=[hx 0xE0042000 32 1]"
set chipid [lindex [read_memory 0xE0042000 32 1] 0]
if {($chipid & 0xFFF) != 0x449} {error "Dispositivo distinto de STM32F74x/75x: se cancela"}
echo "FLASH_SIZE_KiB=[read_memory 0x1FF0F442 16 1]"
echo "UID=[hx 0x1FF0F420 32 3]"
echo "FLASH_OPTCR_OPTCR1=[hx 0x40023C14 32 2]"
echo "RCC_AHB3ENR=[hx 0x40023838 32 1]"
echo "QUADSPI_CR_DCR=[hx 0xA0001000 32 2]"
echo "QUADSPI_SR=[hx 0xA0001008 32 1]"
echo "QUADSPI_CCR=[hx 0xA0001014 32 1]"
echo "VECTOR_FLASH=[hx 0x08000000 32 4]"
echo "ESTADO_DESPUES=[stm32f7x.cpu curstate]"
shutdown
