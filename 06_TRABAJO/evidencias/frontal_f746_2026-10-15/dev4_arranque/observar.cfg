source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
proc w {a} { return [format 0x%08X [lindex [read_memory $a 32 1] 0]] }
if {([lindex [read_memory 0xE0042000 32 1] 0] & 0xFFF) != 0x449} {error "No es STM32F74x"}
echo "L1CR=[w 0x40016884]"
echo "L1WHPCR=[w 0x40016888]"
echo "L1WVPCR=[w 0x4001688c]"
echo "L1PFCR=[w 0x40016894]"
echo "L1CFBAR=[w 0x400168ac]"
echo "L1CFBLR=[w 0x400168b0]"
echo "L1CFBLNR=[w 0x400168b4]"
echo "LTDC_GCR=[w 0x40016818]"
set fb [lindex [read_memory 0x400168AC 32 1] 0]
set pitch [expr {([lindex [read_memory 0x400168B0 32 1] 0] >> 16) & 0x1FFF}]
set lineas [expr {[lindex [read_memory 0x400168B4 32 1] 0] & 0x7FF}]
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/framebuffer.raw} $fb [expr {$pitch * $lineas}]
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_initialized.bin} 0x200007d5 1
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_notice.bin} 0x200007e8 1
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_notice_tick.bin} 0x200007ec 4
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_received.bin} 0x2000081c 56
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_sd_error.bin} 0x2000036c 1
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_sd_open.bin} 0x2000036e 1
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_sd_state.bin} 0x2000036d 1
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_selected_gear.bin} 0x200007f8 1
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_selected_mode.bin} 0x200007f9 1
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_ui.bin} 0x20000854 96
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_uwTick.bin} 0x20000cc8 4
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/dev4_arranque/sym_watchdog_ready.bin} 0x200007d4 1
echo "UWTICK_A=[w 0x20000cc8]"
sleep 500
echo "UWTICK_B=[w 0x20000cc8]"
echo "FIN"
shutdown
