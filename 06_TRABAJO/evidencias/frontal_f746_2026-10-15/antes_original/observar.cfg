source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
proc w {a} { return [format 0x%08X [lindex [read_memory $a 32 1] 0]] }
if {([lindex [read_memory 0xE0042000 32 1] 0] & 0xFFF) != 0x449} {error "No es STM32F74x"}
echo "L1CR=[w 0x40016884]"
echo "L1WHPCR=[w 0x40016888]"
echo "L1WVPCR=[w 0x4001688c]"
echo "L1PFCR=[w 0x40016894]"
echo "L1CFBAR=[w 0x400168ac]"
echo "L1CFBLR=[w 0x400168b0]"
echo "L1CFBLNR=[w 0x400168b4]"
echo "LTDC_GCR=[w 0x40016818]"
set fb [lindex [read_memory 0x400168AC 32 1] 0]
set pitch [expr {([lindex [read_memory 0x400168B0 32 1] 0] >> 16) & 0x1FFF}]
set lineas [expr {[lindex [read_memory 0x400168B4 32 1] 0] & 0x7FF}]
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/antes_original/framebuffer.raw} $fb [expr {$pitch * $lineas}]
dump_image {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/antes_original/sym_uwTick.bin} 0x20003008 4
echo "UWTICK_A=[w 0x20003008]"
sleep 500
echo "UWTICK_B=[w 0x20003008]"
echo "FIN"
shutdown
