# ENS-0019: relectura independiente tras grabar dev4 (sin halt/reset/escritura).
# ENS-0019: relectura independiente tras grabar dev4 (sin halt/reset/escritura).
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
set D {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/relectura}
file mkdir $D
dump_image "$D/interna_0x08000000.bin" 0x08000000 0x3CC24
dump_image "$D/qspi_0x90000000.bin" 0x90000000 0x60EC3C
echo "RELECTURA_FIN=[clock format [clock seconds] -format %H:%M:%S]"
shutdown
