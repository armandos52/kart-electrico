# ENS-0019: restaurar filas 0-47 del framebuffer a blanco (0xFFFF, valor medido antes del patron).
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
foreach base {0xC0000000 0xC003FC00} { mwh $base 0xFFFF [expr {48 * 480}] }
echo "RESTAURADO=[clock format [clock seconds] -format %H:%M:%S]"
shutdown
