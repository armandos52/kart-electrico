# ENS-0019: patron de prueba en filas 0-47 del framebuffer (solo RAM SDRAM, sin halt/reset ni flash).
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
set D {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/franja}
echo "CFBAR_ANTES=[format 0x%08X [lindex [read_memory 0x400168AC 32 1] 0]]"
# Bandas de 12 filas: negro, rojo, verde, azul (RGB565). 12 filas x 480 px = 5760 px.
foreach base {0xC0000000 0xC003FC00} {
	foreach {i color} {0 0x0000 1 0xF800 2 0x07E0 3 0x001F} {
		mwh [expr {$base + $i * 12 * 960}] $color 5760
	}
}
echo "ESCRITO=[clock format [clock seconds] -format %H:%M:%S]"
sleep 2000
set fb [lindex [read_memory 0x400168AC 32 1] 0]
echo "CFBAR_2S=[format 0x%08X $fb]"
dump_image "$D/fb_patron_2s.raw" $fb 261120
shutdown
