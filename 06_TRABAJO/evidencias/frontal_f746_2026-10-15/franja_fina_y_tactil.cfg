# ENS-0019: patron fino de franja (solo RAM framebuffer) y muestreo FT5336 + SD.
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
# Filas 0-35 rojo, 36-39 amarillo, 40-43 magenta, 44-47 cian (RGB565), en ambos buffers.
foreach base {0xC0000000 0xC003FC00} {
	mwh $base 0xF800 [expr {36 * 480}]
	foreach {fila color} {36 0xFFE0 40 0xF81F 44 0x07FF} { mwh [expr {$base + $fila * 960}] $color 1920 }
}
echo "PATRON_FINO=[clock format [clock seconds] -format %H:%M:%S]"
set duracion_ms 900000
set prev ""; set t0 [clock milliseconds]; set ultimo_latido 0
while {[clock milliseconds] - $t0 < $duracion_ms} {
	set h [read_memory 0x20000cc2 8 3]
	set u [read_memory 0x20000854 8 96]
	set filas [expr {[lindex $u 32] | ([lindex $u 33]<<8) | ([lindex $u 34]<<16) | ([lindex $u 35]<<24)}]
	set estado "toques=[lindex $h 1] sol=[lindex $u 64] aviso=[lindex $u 77] sdreq=[lindex $u 74] sd=[lindex $u 75] sderr=[lindex $u 76] filas=$filas"
	set rel [expr {[clock milliseconds] - $t0}]
	if {$estado ne $prev} { echo "CAMBIO [clock format [clock seconds] -format %H:%M:%S] t=$rel $estado"; set prev $estado } elseif {$rel - $ultimo_latido > 15000} { echo "LATIDO t=$rel"; set ultimo_latido $rel }
	sleep 30
}
echo "FIN=[clock format [clock seconds] -format %H:%M:%S]"
shutdown
