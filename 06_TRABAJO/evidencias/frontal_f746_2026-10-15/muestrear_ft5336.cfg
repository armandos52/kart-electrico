# ENS-0019: muestreo del controlador tactil FT5336 e I2C3. Solo lectura, sin halt/reset/escritura.
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
set duracion_ms 150000
set prev ""; set t0 [clock milliseconds]; set n 0; set con_toque 0; set ultimo_latido 0
echo "INICIO=[clock format [clock seconds] -format %H:%M:%S]"
while {[clock milliseconds] - $t0 < $duracion_ms} {
	set h [read_memory 0x20000cc2 8 3]
	set st [lindex [read_memory 0x20000b89 8 1] 0]
	set err [lindex [read_memory 0x20000b8c 32 1] 0]
	set isr [lindex [read_memory 0x40005C18 32 1] 0]
	set u [read_memory 0x20000854 8 96]
	set rel [expr {[clock milliseconds] - $t0}]
	incr n
	if {[lindex $h 1] > 0} {incr con_toque}
	set estado "ft5336(init,nb,idx)=$h i2c_state=$st i2c_err=[format 0x%X $err] sol=[lindex $u 64] sdreq=[lindex $u 74] aviso=[lindex $u 77]"
	if {$estado ne $prev} { echo "CAMBIO t=$rel isr=[format 0x%08X $isr] $estado"; set prev $estado } elseif {$rel - $ultimo_latido > 10000} { echo "LATIDO t=$rel muestras=$n con_toque=$con_toque"; set ultimo_latido $rel }
	sleep 30
}
echo "RESUMEN muestras=$n con_toque=$con_toque"
echo "FIN=[clock format [clock seconds] -format %H:%M:%S]"
shutdown
