# ENS-0019: seguimiento de estado durante pruebas tactiles. Solo lectura, sin halt/reset/escritura.
# ENS-0019: seguimiento de estado durante pruebas tactiles. Solo lectura, sin halt/reset/escritura.
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
set QUADSPI 1
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
set D {C:/kart proyecto/06_TRABAJO/evidencias/frontal_f746_2026-10-15/tactil}
set UI 0x20000854
set duracion_ms 420000
set prev ""; set capturas 0; set t0 [clock milliseconds]; set ultimo_latido 0
echo "INICIO=[clock format [clock seconds] -format %H:%M:%S]"
while {[clock milliseconds] - $t0 < $duracion_ms} {
	set b [read_memory $UI 8 96]
	set tick [expr {[lindex $b 0] | ([lindex $b 1]<<8) | ([lindex $b 2]<<16) | ([lindex $b 3]<<24)}]
	set filas [expr {[lindex $b 32] | ([lindex $b 33]<<8) | ([lindex $b 34]<<16) | ([lindex $b 35]<<24)}]
	# input_flags brake start gear mode_req mode_rec mode_apl inhibit | sd_req sd_state sd_error notice
	set estado "in=[lindex $b 60] fr=[lindex $b 61] st=[lindex $b 62] mar=[lindex $b 63] sol=[lindex $b 64] rec=[lindex $b 65] apl=[lindex $b 66] inh=[lindex $b 67] sdreq=[lindex $b 74] sd=[lindex $b 75] sderr=[lindex $b 76] aviso=[lindex $b 77]"
	set rel [expr {[clock milliseconds] - $t0}]
	if {$estado ne $prev} {
		echo "CAMBIO t=$rel ms tick=$tick filas=$filas $estado"
		if {$capturas < 16} {
			incr capturas
			set fb [lindex [read_memory 0x400168AC 32 1] 0]
			dump_image [format "%s/fb_%02d_t%06d.raw" $D $capturas $rel] $fb 261120
			echo "CAPTURA $capturas fb=[format 0x%08X $fb] t=$rel"
		}
		set prev $estado
	} elseif {$rel - $ultimo_latido > 10000} {
		echo "LATIDO t=$rel ms tick=$tick filas=$filas"
		set ultimo_latido $rel
	}
	sleep 150
}
echo "FIN=[clock format [clock seconds] -format %H:%M:%S]"
shutdown
