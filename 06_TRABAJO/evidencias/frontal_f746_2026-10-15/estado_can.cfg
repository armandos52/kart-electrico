# ENS-0019: lectura de registros CAN1 en ejecucion (sin halt/reset/escritura) para saber si hay otro nodo en el bus.
source [find interface/stlink.cfg]
transport select swd
adapter serial 0670FF3332584B3043206038
source [find target/stm32f7x.cfg]
adapter speed 1800
gdb port disabled
tcl port disabled
telnet port disabled
stm32f7x.cpu configure -event examine-end {}
init
proc w {a} { return [format 0x%08X [lindex [read_memory $a 32 1] 0]] }
echo "RCC_APB1ENR=[w 0x40023840]"
foreach {n o} {MCR 0x00 MSR 0x04 TSR 0x08 RF0R 0x0C RF1R 0x10 ESR 0x18 BTR 0x1C} { echo "CAN1_$n=[w [expr {0x40006400 + $o}]]" }
sleep 1000
foreach {n o} {MSR 0x04 TSR 0x08 RF0R 0x0C ESR 0x18} { echo "CAN1_${n}_1s=[w [expr {0x40006400 + $o}]]" }
shutdown
